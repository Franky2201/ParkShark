# Separate in-memory database for tests
spring.datasource.url=jdbc:h2:mem:parkshark_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run migrations against the test database
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=parkshark
spring.flyway.schemas=parkshark

# Hibernate checks the schema created by Flyway
spring.jpa.properties.hibernate.default_schema=parkshark
spring.jpa.hibernate.ddl-auto=validate