spring.application.name=ParkShark
spring.datasource.url=jdbc:postgresql://ec2-15-237-74-163.eu-west-3.compute.amazonaws.com:443/bordeaux_bros?currentSchema=parkshark
spring.datasource.username=student
spring.datasource.password=${DB_PASSWORD}
spring.flyway.default-schema=parkshark
spring.flyway.schemas=parkshark

spring.jpa.properties.hibernate.default_schema=parkshark
spring.jpa.hibernate.ddl-auto=validate

## Flyway runs your real migrations against H2 -- should be in test.properties
spring.flyway.enabled=true
## Let Flyway own the schema; Hibernate only checks it

## logging
logging.level.root=INFO
logging.level.com.bordeauxbrothers.parkshark=INFO
logging.file.name=logs/parkshark.log
